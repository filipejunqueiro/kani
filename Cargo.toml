[workspace]
resolver = "3"
members = ["crates/api", "crates/engine"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
engine = { path = "crates/engine" }
rustfs-mimalloc = "0.7.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
prost = "0.14.4"
tonic = "0.14.6"
tonic-prost-build = "0.14.6"
dashmap = "6.2.1"
